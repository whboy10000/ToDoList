name: Build Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    name: Windows 安装包 (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 打包 zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ToDoList-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoList-windows-x64
          path: ToDoList-windows-x64.zip

  build-linux:
    name: Linux 安装包 (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: 打包 tar.gz
        run: |
          tar -czf ToDoList-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoList-linux-x64
          path: ToDoList-linux-x64.tar.gz

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoList-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-docker:
    name: Web Docker 镜像 (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 制作 DMG
        run: |
          hdiutil create -volname ToDoList -srcfolder build/macos/Build/Products/Release/ToDoList.app -ov -format UDZO ToDoList-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoList-macos
          path: ToDoList-macos.dmg

  build-ios:
    name: iOS IPA (未签名)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: 打包未签名 IPA
        run: |
          rm -rf Payload ToDoList-ios-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ToDoList-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoList-ios
          path: ToDoList-ios-unsigned.ipa

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos, build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总并重命名安装包
        run: |
          mkdir -p release
          cp artifacts/ToDoList-windows-x64/ToDoList-windows-x64.zip   release/
          cp artifacts/ToDoList-linux-x64/ToDoList-linux-x64.tar.gz    release/
          cp artifacts/ToDoList-macos/ToDoList-macos.dmg               release/
          cp artifacts/ToDoList-android/app-release.apk               release/ToDoList-android.apk
          cp artifacts/ToDoList-ios/ToDoList-ios-unsigned.ipa         release/
          ls -lh release
      - name: 创建 Release 并附加安装包
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ToDoList-windows-x64.zip
            release/ToDoList-linux-x64.tar.gz
            release/ToDoList-macos.dmg
            release/ToDoList-android.apk
            release/ToDoList-ios-unsigned.ipa
