name: Build Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    name: Windows 安装包 (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 打包 zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TaskFlow-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-windows-x64
          path: TaskFlow-windows-x64.zip

  build-linux:
    name: Linux 安装包 (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: 打包 tar.gz
        run: |
          tar -czf TaskFlow-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-linux-x64
          path: TaskFlow-linux-x64.tar.gz

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 制作 DMG
        run: |
          hdiutil create -volname TaskFlow -srcfolder build/macos/Build/Products/Release/flutter_quickstart.app -ov -format UDZO TaskFlow-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-macos
          path: TaskFlow-macos.dmg
