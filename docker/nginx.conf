server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/wasm
               application/json image/svg+xml font/ttf font/otf;

    # HTML 入口不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源长缓存（Flutter 产物文件名带 hash）
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退（PathUrlStrategy 刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
